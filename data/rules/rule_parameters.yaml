  # --- Riester subsidy (Story 4.1). Values from experiments/data/rules/rule_parameters.yaml; valid to the end of 2026
  # because the reform announced from 2027 is not confirmed yet (data/rules/README.md). A question about 2027 or the
  # new subsidised product finds no valid version and escalates (UJ-5).
  - key: riester_basic_allowance
    value: 175
    unit: EUR
    valid_from: 2018-01-01
    valid_to: 2026-12-31
    source: "§ 84 EStG (Grundzulage)"
