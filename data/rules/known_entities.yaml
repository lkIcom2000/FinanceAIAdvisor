# Registry of verifiable entities for false-premise detection (DETECT_TRAP, PRD FR-15).
#
# The NLU lists the premises a question takes for granted. A premise about a law, regulation,
# product or ISIN counts as verified only if its named entity matches an entry below (or a
# Knowledge Base document title when retrieval is on). Premises about guarantees or compensation
# count as verified only if they match `known_guarantees`.
#
# This is a design parameter. It lists real regulations and institutions in general; it must not
# be tuned to individual test items (threat to validity otherwise).

laws_and_regulations:
  - MiFID II
  - MiFID
  - MiFIR
  - Markets in Financial Instruments Directive
  - WpHG
  - Wertpapierhandelsgesetz
  - IDD
  - Insurance Distribution Directive
