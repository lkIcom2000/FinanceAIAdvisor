products_and_isins: []   # filled from the Knowledge Base; no individual product is pre-verified

known_guarantees:
  - statutory deposit guarantee up to 100,000 EUR per bank and customer
  - Einlagensicherung
  - deposit guarantee
  - investor compensation scheme up to 20,000 EUR (EdW)

# Wording that marks a premise as a claim about guaranteed outcomes, compensation or obligations
# that no regulator or product provides. Used together with the premise kind.
suspicious_claim_patterns:
  - "guarantee"
  - "guaranteed"
  - "compensat"
  - "reimburs"
  - "promise"
  - "minimum return"
  - "mandatory investment"
  - "penalty tax"
  - "return algorithm"
