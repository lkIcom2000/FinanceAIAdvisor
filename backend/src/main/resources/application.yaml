spring:
  application:
    name: fine
  # Versioned configuration files below APP_HOME (AD-14, AD-25). Not optional: a missing file stops startup.
  config:
    import:
      - file:${APP_HOME:..}/config/agent/${APP_AGENT_CONFIG:reference}.yaml
      - file:${APP_HOME:..}/config/autonomy.yaml
      - file:${APP_HOME:..}/config/profile-minimums.yaml
  # The application connects as the non-owner role fine_app (INSERT and SELECT only on audit tables, AD-13);
  # Flyway migrates as the owner and sets fine_app's password from SPRING_DATASOURCE_PASSWORD.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fine}
    username: ${SPRING_DATASOURCE_USERNAME:fine_app}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    locations: classpath:db/migration,classpath:db/callback
    user: ${SPRING_DATASOURCE_OWNER_USERNAME:fine}
    password: ${SPRING_DATASOURCE_OWNER_PASSWORD:}
    placeholders:
      appDbPassword: ${spring.datasource.password}
  mvc:
    problemdetails:
      enabled: true

server:
  servlet:
    session:
      timeout: 30m

springdoc:
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
  swagger-ui:
    csrf:
      enabled: true
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true

logging:
  structured:
    format:
      console: ecs

# APP_HOME: repository root when run from backend/, /app in the image (set by the Dockerfile).
app:
  home: ${APP_HOME:..}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
