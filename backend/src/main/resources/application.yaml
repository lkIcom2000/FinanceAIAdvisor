spring:
  application:
    name: fine
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fine}
    username: ${SPRING_DATASOURCE_USERNAME:fine}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

springdoc:
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true

logging:
  structured:
    format:
      console: ecs

# APP_HOME: repository root when run from backend/, /app in the image (set by the Dockerfile).
app:
  home: ${APP_HOME:..}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
