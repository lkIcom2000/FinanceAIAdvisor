<app-header />

<div class="workspace">
  <main #overview class="overview" aria-label="Financial overview">
    <mat-tab-group
      mat-stretch-tabs="false"
      mat-align-tabs="start"
      preserveContent
      [selectedIndex]="selectedIndex()"
      (selectedIndexChange)="select($event)"
      (animationDone)="restoreScroll()"
    >
      @for (t of tabs; track t.key) {
        <mat-tab [label]="t.label">
          <section class="tab-content" [attr.data-tab]="t.key">
            @if (t.key === 'home') {
              <app-home-tab />
            } @else if (t.key === 'liquidity') {
              <app-liquidity-tab />
            } @else if (t.key === 'wealth') {
              <app-wealth-tab />
            }
          </section>
        </mat-tab>
      }
    </mat-tab-group>
  </main>

  <aside class="chat" aria-label="Chat with Fine"><app-chat-column /></aside>
</div>
